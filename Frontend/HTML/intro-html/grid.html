<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid Practice </title>
</head>
<body>
    <div style="
    display: grid;
    grid-template-columns: 100px 100px;
    ">
        <div style="background-color: aqua;">div 1</div>
        <div style="background-color: red;">div 2 <p>text</p></div>
    </div>
    <div style="
    margin-top: 10px;
    display: grid;
    grid-template-columns: 100px 1fr 1fr;
    ">
        <div style="background-color: aqua;">div 1</div>
        <div style="background-color: red;">div 2 <p>text</p></div>
        <div style="background-color: pink;">div 3</div>
        
    </div>
    <div style="
    margin-top: 10px;
    display: grid;
    grid-template-columns: 100px 1fr 2fr;
    column-gap: 10px;
    ">
        <div style="background-color: aqua;">div 1</div>
        <div style="background-color: pink;">div 3</div>
        <div style="background-color: red;">div 2 <p>text</p></div>
        
        
    </div>
</body>
</html>
