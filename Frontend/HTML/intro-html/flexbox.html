<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Practice</title>
</head>
<body style="padding-bottom: 100px;"">
    <div style="
        display: flex;   
        flex-direction:row;
    ">
        <div style="background-color: pink;">div 1 text</div>
        <div style="background-color: aqua;">div 2 <p>Text</p></div>
    </div>

    <div style="
        display: flex;   
        flex-direction:row;
        margin-top: 10px;
        
    ">
        <div style="background-color: pink;width: 100px;">100px</div>
        <div style="background-color: aqua; flex: 1;">div 2 <p>Text</p></div>
    </div>
    <div style="
        display: flex;   
        flex-direction:row;
        margin-top: 10px;
        margin-bottom: 20px;
        
    ">
        <div style="background-color: pink;width: 100px;">100px</div>
        <div style="background-color: maroon; flex: 2;">div 3 <p>Text</p></div>
        <div style="background-color: aqua; flex: 1;">div 2 <p>Text</p></div>
        
    </div>

    <div style="display: flex;
    flex-direction: row;
    height: 70px;
    border-width: px;
    border-style: solid;
    border-color: gray;
    justify-content: space-between;
    ">
     <div style="background-color: pink;width: 100px;">100px</div>
        <div style="background-color: maroon; width: 100px;;">div 3 <p>Text</p></div>
        <div style="background-color: aqua; width: 100px;;">div 2 <p>Text</p></div>

    </div>

    <div style="display: flex;
    flex-direction: row;
    height: 70px;
    border-width: px;
    border-style: solid;
    border-color: gray;
    justify-content: space-between;
    align-items: end;
    ">
     <div style="background-color: pink;width: 100px;">100px</div>
        <div style="background-color: maroon; width: 100px;;">div 3 <p>Text</p></div>
        <div style="background-color: aqua; width: 100px;;">div 2 <p>Text</p></div>

    </div>

    <div style="display: flex;
  flex-direction: row;
  justify-content: space-between;
  border-width: 1px;
  border-style: solid;
  border-color: rgb(150, 150, 150);
  height: 50px;
  align-items: center;
    ">
            <div class="h">item1</div>
            <div class="h">item2</div>
            <div class="h">item3</div>
            <div class="h">item4</div>
    </div>

        .h{
            background-color: lightpink;        
        }

</html>
